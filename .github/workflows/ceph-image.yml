name: Publish Ceph test image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ceph-image.yml
      - test/ceph/Containerfile
      - test/ceph/entrypoint.sh

permissions:
  contents: read
  packages: write

concurrency:
  group: ceph-test-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ceph-go-ceph-test
  IMAGE_TAG: main

jobs:
  publish:
    name: Build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: test/ceph
          file: test/ceph/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=ceph-test-image
          cache-to: type=gha,mode=max,scope=ceph-test-image

      - name: Select candidate image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          echo "CEPH_TEST_IMAGE=${image}" >>"${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Start published Ceph image
        run: docker compose -f test/ceph/compose.yaml up --no-build --pull always --wait

      - name: Test published Ceph image
        run: go test -p 1 -count=1 -v ./test/ceph/integration/...

      - name: Show Ceph logs
        if: failure()
        run: docker compose -f test/ceph/compose.yaml logs --no-color

      - name: Stop Ceph
        if: always()
        run: docker compose -f test/ceph/compose.yaml down --volumes

      - name: Promote tested image to main
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" \
            "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Summarize published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            echo '## Published Ceph test image'
            echo
            echo "Promoted \`${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}\` after successful integration tests."
            echo
            echo 'Tested digest:'
            echo
            echo '```text'
            echo "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
