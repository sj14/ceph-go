services:
  ceph:
    image: ${CEPH_TEST_IMAGE:-ceph-go-test:local}
    build:
      context: .
      dockerfile: Containerfile
    environment:
      CEPH_DASHBOARD_USER: admin
      CEPH_DASHBOARD_PASSWORD: admin
      CEPH_ADMIN_RGW_CAPS: ${CEPH_ADMIN_RGW_CAPS:-}
    ports:
      - "8000:8000"
      - "8443:8443"
    tmpfs:
      - /var/lib/ceph
      - /run/ceph
